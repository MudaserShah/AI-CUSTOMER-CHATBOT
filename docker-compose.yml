services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ai_chatbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_your_env_file}
      POSTGRES_DB: ai_customer_chatbot
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_chatbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build: .
    ports:
      - "8000:8000"
    # Secrets and settings that don't change based on "am I in Docker or
    # not" (API keys, JWT secret) come from your .env file as-is.
    env_file:
      - .env
    # POSTGRES_URI and QDRANT_URL are the two exceptions: your .env
    # points them at "localhost" for running the app directly on your
    # machine, but inside Docker's network "localhost" means the app
    # container itself, not the postgres/qdrant containers — so these
    # two are overridden here to use the service names above instead.
    # Everything else in .env passes through unchanged.
    environment:
      POSTGRES_URI: postgresql://ai_chatbot:${POSTGRES_PASSWORD:-changeme_in_your_env_file}@postgres:5432/ai_customer_chatbot
      QDRANT_URL: http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  postgres_data:
  qdrant_data:
