name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_customer_chatbot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_URI: postgresql://postgres:postgres@localhost:5432/ai_customer_chatbot_ci
      JWT_SECRET: ci-test-secret-not-for-production
      JWT_EXPIRY_MINUTES: "60"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      OPENROUTER_API_KEY: ci-placeholder
      QDRANT_URL: http://localhost:6333
      QDRANT_API_KEY: ci-placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black ruff pytest

      - name: Lint (ruff)
        run: ruff check .
        continue-on-error: true

      - name: Format check (black)
        run: black --check .
        continue-on-error: true

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run tests
        run: python -m pytest -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  build-docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ai-customer-chatbot:ci .
